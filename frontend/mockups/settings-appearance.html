<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Appearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem('okojie-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<style>
.settings { display: grid; grid-template-columns: 200px minmax(0, 720px); gap: 24px; align-items: start; }
.subnav { display: grid; gap: 2px; position: sticky; top: 24px; }
.subnav a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; color: var(--color-text-secondary); font-size: 14px; }
.subnav a svg { color: var(--color-text-tertiary); }
.subnav a[aria-current="page"] { background: var(--color-surface); color: var(--color-text-primary); font-weight: 500; box-shadow: var(--shadow-card); }
.subnav a[aria-current="page"] svg { color: var(--color-accent-text); }
@media (hover: hover) { .subnav a:not([aria-current]):hover { background: rgb(127 127 127 / .08); color: var(--color-text-primary); } }
.sec-desc { color: var(--color-text-tertiary); font-size: 13.5px; margin: -4px 0 4px; }
.avatar-row { display: flex; align-items: center; gap: 16px; }
.avatar-row .avatar { width: 64px; height: 64px; font-size: 20px; }
.avatar-row .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.danger { box-shadow: inset 0 0 0 1px rgb(185 50 42 / .25); }
.btn-danger { background: var(--color-danger-text); color: #fff; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme-opt { cursor: pointer; display: grid; gap: 10px; }
.theme-opt input { position: absolute; opacity: 0; pointer-events: none; }
.theme-prev { height: 108px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 30% 1fr; box-shadow: inset 0 0 0 1px var(--color-border-strong); transition: box-shadow 120ms ease; }
.theme-opt:has(input:checked) .theme-prev { box-shadow: 0 0 0 2px var(--color-accent-solid), 0 0 0 5px var(--color-accent-soft); }
.theme-opt:has(input:focus-visible) .theme-prev { outline: 2px solid var(--color-accent-solid); outline-offset: 4px; }
.theme-prev .s { padding: 10px 8px; display: grid; gap: 5px; align-content: start; }
.theme-prev .s i, .theme-prev .m i { display: block; height: 6px; border-radius: 3px; }
.theme-prev .m { padding: 12px; display: grid; gap: 8px; align-content: start; }
.theme-prev .m b { display: block; height: 30px; border-radius: 7px; }
.tp-light .s { background: #EFF0F3; } .tp-light .m { background: #F5F6F8; } .tp-light i { background: #D7D9E0; } .tp-light b { background: #fff; box-shadow: 0 0 0 1px rgb(16 19 40 / .06); }
.tp-dark .s { background: #151519; } .tp-dark .m { background: #0F0F12; } .tp-dark i { background: #2A2A31; } .tp-dark b { background: #1B1B20; }
.tp-sys { position: relative; }
.tp-sys > div { display: contents; }
.theme-opt span.lbl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.theme-opt span.lbl svg { color: var(--color-text-tertiary); }
.pref { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--color-border); }
.pref:first-child { border-top: 0; padding-top: 0; }
.pref b { display: block; font-weight: 500; font-size: 14px; }
.pref small { display: block; color: var(--color-text-tertiary); font-size: 13px; }
.session { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--color-border); }
.session:first-child { border-top: 0; padding-top: 0; }
.session .tile { width: 34px; height: 34px; border-radius: 9px; }
.session .row-meta small { white-space: normal; }
@media (max-width: 900px) { .settings { grid-template-columns: minmax(0, 1fr); } .subnav { position: static; grid-auto-flow: column; overflow-x: auto; justify-content: start; } .themes { grid-template-columns: 1fr 1fr 1fr; } }
@media (max-width: 640px) { .themes { grid-template-columns: 1fr; } }
</style>
</head>
<body data-area="admin" data-active="settings">
<a class="skip-link" href="#main">Skip to content</a>
<main class="main" id="main">
  <header class="page-head">
    <div><span class="eyebrow">Account</span><h1>Settings</h1><div class="sub">Manage your profile, sign-in and display preferences.</div></div>
    <div class="head-actions"><button class="icon-btn theme-btn" type="button" aria-label="Switch theme"><svg class="i ico ico-moon"><use href="#i-moon"/></svg><svg class="i ico ico-sun"><use href="#i-sun"/></svg></button></div>
  </header>
  <div class="settings">
    <nav class="subnav" aria-label="Settings">
      <a href="settings-profile.html"><svg class="i"><use href="#i-user"/></svg>Profile</a>
      <a href="settings-security.html"><svg class="i"><use href="#i-lock"/></svg>Security</a>
      <a href="settings-appearance.html" aria-current="page"><svg class="i"><use href="#i-monitor"/></svg>Appearance</a>
    </nav>
    <div class="col">
      <section class="shell" aria-labelledby="ap-t">
        <div class="shell-head"><h2 id="ap-t"><svg class="i i-sm"><use href="#i-monitor"/></svg>Theme</h2></div>
        <div class="inner">
          <p class="sec-desc" style="margin:0 0 16px">Choose how Okojie looks on this device.</p>
          <fieldset><legend class="sr-only">Theme</legend>
          <div class="themes">
            <label class="theme-opt"><input type="radio" name="th" value="light"><span class="theme-prev tp-light"><span class="s"><i></i><i></i><i></i></span><span class="m"><i style="width:60%"></i><b></b><b></b></span></span><span class="lbl"><svg class="i i-sm"><use href="#i-sun"/></svg>Light</span></label>
            <label class="theme-opt"><input type="radio" name="th" value="dark"><span class="theme-prev tp-dark"><span class="s"><i></i><i></i><i></i></span><span class="m"><i style="width:60%"></i><b></b><b></b></span></span><span class="lbl"><svg class="i i-sm"><use href="#i-moon"/></svg>Dark</span></label>
            <label class="theme-opt"><input type="radio" name="th" value="system" checked><span class="theme-prev" style="background:linear-gradient(105deg,#F5F6F8 50%,#0F0F12 50%)"></span><span class="lbl"><svg class="i i-sm"><use href="#i-monitor"/></svg>Match my system</span></label>
          </div>
          </fieldset>
        </div>
      </section>
      <section class="shell" aria-labelledby="dn-t">
        <div class="shell-head"><h2 id="dn-t"><svg class="i i-sm"><use href="#i-sliders"/></svg>Display</h2></div>
        <div class="inner">
          <div class="pref"><span><b>Compact tables</b><small>Fit more clients and leads on screen.</small></span><label class="switch"><input type="checkbox" aria-label="Compact tables"><span></span></label></div>
          <div class="pref"><span><b>Reduce motion</b><small>Turn off sliding and fading animations.</small></span><label class="switch"><input type="checkbox" aria-label="Reduce motion"><span></span></label></div>
        </div>
      </section>
    </div>
  </div>
</main>
<script>
  document.querySelectorAll('input[name="th"]').forEach(function (r) {
    r.addEventListener('change', function () {
      var v = r.value === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : r.value;
      document.documentElement.classList.add('theme-switching');
      document.documentElement.dataset.theme = v;
      try { if (r.value === 'system') localStorage.removeItem('okojie-theme'); else localStorage.setItem('okojie-theme', r.value); } catch (e) {}
      requestAnimationFrame(function () { requestAnimationFrame(function () { document.documentElement.classList.remove('theme-switching'); }); });
    });
  });
</script>
<script src="shared/app.js"></script>
</body>
</html>
